name: Main Workflow

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Lint · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest -q

      - name: Build
        run: uv build

  generated:
    name: generated code matches proto/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"

      - name: Regenerate
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: uv run --frozen python scripts/gen_protos.py

      - name: No difference
        run: |
          git status --porcelain -- zqnt_api/generated
          test -z "$(git status --porcelain -- zqnt_api/generated)"
