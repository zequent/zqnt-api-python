name: Pull Request Workflow

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest -q

      - name: Preview version
        id: version
        run: |
          VERSION=$(grep "^version" pyproject.toml | cut -d'"' -f2)
          PR_VERSION="${VERSION}+pr${{ github.event.number }}.$(git rev-parse --short HEAD)"
          sed -i "s/^version = \".*\"/version = \"${PR_VERSION}\"/" pyproject.toml
          echo "pr_version=${PR_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Preview version: ${PR_VERSION}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: uv build

  generated:
    name: generated code matches proto/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"

      - name: Regenerate
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: uv run --frozen python scripts/gen_protos.py

      - name: No difference
        run: |
          git status --porcelain -- zqnt_api/generated
          test -z "$(git status --porcelain -- zqnt_api/generated)"

  pr-preview:
    name: Tag PR preview build
    needs: [test, generated]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute preview tag
        id: tag
        run: |
          TAG="pr-${{ github.event.pull_request.number }}-$(git rev-parse --short=7 HEAD)"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Preview tag: ${TAG}" | tee -a "$GITHUB_STEP_SUMMARY"

      # The checkout keeps no credentials; the push authenticates in this step only.
      - name: Create and push preview tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag "${{ steps.tag.outputs.tag }}"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${{ steps.tag.outputs.tag }}"
