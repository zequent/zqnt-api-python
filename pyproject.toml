[project]
name = "zqnt-api"
version = "3.0.0"
description = "Public Python API of the Zequent platform: protobuf/gRPC types and the telemetry mapping the Python SDKs build on"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "grpcio>=1.80.0",
    "protobuf>=6.31.1",
]

[project.urls]
Repository = "https://github.com/Zequent/zqnt-api-python"

[dependency-groups]
dev = [
    "ruff>=0.15.15",
    "pytest>=9.0.3",
    "grpcio-tools==1.80.0",
    "mypy-protobuf==5.1.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zqnt_api"]

[tool.hatch.build.targets.sdist]
include = ["zqnt_api", "proto", "scripts", "tests", "README.md", "LICENSE", "NOTICE"]

[tool.ruff]
exclude = ["zqnt_api/generated/**"]
